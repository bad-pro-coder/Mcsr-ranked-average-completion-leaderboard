<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');
    html{
      font-family:outfit;
    }body{
      background-color:black;
      color:white;
    }
    </style>
</head>
<body>
<h1>Mcsr ranked average completion leaderboard*</h1>
  <h6>*Only including players in the top 100 elo</h6>
<ol id="rankedLB">  
</ol>
  <p id="loading"></p>
  <script>
    let oldLB;
    try{
      if (JSON.parse(localStorage.myMap)) {
       oldLB = JSON.parse(localStorage.myMap)
        //console.log(oldLB)
     }
    }catch{
      ;
    }
  
  const overallLB = new Map([]);
async function getDataRanked() {
  let loadProgress = document.getElementById("loading").innerText
  loadProgress = "Loading 0/200"
  let progress = 0;
  try {
    const response = await fetch("https://api.mcsrranked.com/leaderboard", {
      cache: "no-store" 
    })
    if (!response.ok) {
      throw new Error(`Response status: ${response.status}`);
    }
    
    const result = await response.json();
    for (let i = 0; i < 100; i++) {
      let avg = await getAvg(result.data.users[i].nickname);
      let comparison = 0;
      try{
        for(let j = 0; j < 100; j++){
          if(oldLB[j][1].user == result.data.users[i].nickname){
            comparison = avg.rawAvg - oldLB[j][1].rawAverage
            break
          }
        }
      }catch{
        ;
      }
      overallLB.set(i, {average: avg.averageMins, rawAverage: avg.rawAvg, user: result.data.users[i].nickname, change: comparison})
      let stop = false;
      let currentSpot = i;
      try{
        while (stop === false){
          if (overallLB.get(currentSpot).rawAverage < overallLB.get(currentSpot - 1).rawAverage){
         overallLB.set(currentSpot, overallLB.get(currentSpot - 1))
         overallLB.set(currentSpot - 1, {average: avg.averageMins, rawAverage: avg.rawAvg, user: result.data.users[i].nickname, change: comparison})
            currentSpot = currentSpot - 1
          }else{
            stop = true;
          }
        }
      }
      catch{
        ;
      }
      progress += 1;
      document.getElementById("loading").innerText = `Loading ${progress}/100`
    }
  } catch (error) {
    console.error(error.message);
  }
  localStorage.myMap = JSON.stringify(Array.from(overallLB.entries()));
}
async function getLB(){
  await getDataRanked();
  for (let i = 0; i < 100; i++){
    const player = document.createElement("li")
    let stats = overallLB.get(i)
    if (stats.change > 0){
      player.innerText = stats.user + " " + stats.average + ", change since last visit: +" + ((Math.floor(stats.change*10))/10) + "s"
    }else if(stats.change < 0){
       player.innerText = stats.user + " " + stats.average + ", change since last visit: " + ((Math.floor(stats.change*10))/10) + "s"
    }else{
      player.innerText = stats.user + " " + stats.average
    }
    document.getElementById("rankedLB").appendChild(player);
  }
}
getLB();


async function getAvg(user){
  try {
      const response = await fetch(`https://api.mcsrranked.com/users/${user}/`, {
      cache: "no-store" 
    })
      if (!response.ok) {
        throw new Error(`Response status: ${response.status}`);
      }
    const result = await response.json();
    let mins = (((result.data.statistics.season.completionTime.ranked/1000)/result.data.statistics.season.completions.ranked)/60)
    let secs = Math.floor((mins % Math.floor(mins))*60)
    if (secs < 10){
      secs = "0" + secs
    }
    return {averageMins: Math.floor(mins) + ":" + secs, rawAvg: ((result.data.statistics.season.completionTime.ranked/1000)/result.data.statistics.season.completions.ranked)}
  }catch(error){
    console.error(error.message);
  }
}

</script>
</body>
</html>
