<!DOCTYPE html>
<head>
  <style>
    </style>
</head>
<body>
<h1>Mcsr ranked average completion leaderboard</h1>
<ol id="rankedLB">  
</ol>
</body>
<script>
  const overallLB = new Map([]);
async function getDataRanked() {
  document.getElementById("rankedLB").innerText = "Loading........................"
  try {
    const response = await fetch("https://api.mcsrranked.com/leaderboard");
    if (!response.ok) {
      throw new Error(`Response status: ${response.status}`);
    }

    const result = await response.json();
    for (let i = 0; i < 100; i++) {
      let avg = await getAvg(result.data.users[i].nickname);
      overallLB.set(i, {average: avg.averageMins, rawAverage: avg.rawAvg, user: result.data.users[i].nickname})
      //console.log(overallLB.get(i))
      let stop = false;
      let currentSpot = i;
      try{
        while (stop === false){
          if (overallLB.get(currentSpot).rawAverage < overallLB.get(currentSpot - 1).rawAverage){
         overallLB.set(currentSpot, overallLB.get(currentSpot - 1))
         overallLB.set(currentSpot - 1, {average: avg.averageMins, rawAverage: avg.rawAvg, user: result.data.users[i].nickname})
            currentSpot = currentSpot - 1
          }else{
            stop = true;
          }
        }
      }
      catch{
        ;
      }
    }
  } catch (error) {
    console.error(error.message);
  }
}
async function getLB(){
  await getDataRanked();
  for (let i = 0; i < 100; i++){
    const player = document.createElement("li")
    let stats = overallLB.get(i)
    player.innerText = stats.user + " " + stats.average
    document.getElementById("rankedLB").appendChild(player);
  }
}
getLB();
document.getElementById("rankedLB").innerText = ""
async function getAvg(user){
  try {
      const response = await fetch(`https://api.mcsrranked.com/users/${user}/`);
      if (!response.ok) {
        throw new Error(`Response status: ${response.status}`);
      }
    const result = await response.json();
    let mins = (((result.data.statistics.season.completionTime.ranked/1000)/result.data.statistics.season.completions.ranked)/60)
    let secs = Math.floor((mins % Math.floor(mins))*60)
    if (secs < 10){
      secs = "0" + secs
    }
    return {averageMins: Math.floor(mins) + ":" + secs, rawAvg: ((result.data.statistics.season.completionTime.ranked/1000)/result.data.statistics.season.completions.ranked)}
  }catch(error){
    console.error(error.message);
  }
}

</script>
